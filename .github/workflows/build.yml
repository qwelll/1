name: Build Deb

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-latest # 必须使用 macOS 环境

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 自动解压你上传的 tar.gz 包 (保留这一部分)
      - name: Extract source
        run: |
          tar -xzvf liquidass-alerts-only-src.tar.gz
          ls -la

      # 2. 手动安装 Theos（替换掉那个已经失效的action）
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      # 3. 进入解压出的目录进行编译
      - name: Build Package
        run: |
          if [ -d "liquidass-alerts-only-src" ]; then cd liquidass-alerts-only-src; fi
          make clean
          make package FINALPACKAGE=1

      # 4. 上传编译好的 deb 文件
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: liquidass-deb
          path: "**/*.deb"