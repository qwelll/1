name: Build Deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 解压源码包
      - name: Extract source
        run: |
          tar -xzvf NoNotesToolbar.tar.gz
          ls -la
          find . -name "Makefile" -not -path './.git*'

      # 2. 安装 Theos + SDK + ldid
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || cp -R /tmp/sdks/iPhoneOS*.sdk $THEOS/sdks/
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          ls $THEOS/sdks/

      # 3. 编译（自动找到含 Makefile 的目录）
      - name: Build Package
        run: |
          MAKEFILE_DIR=$(find . -name "Makefile" -not -path './.git*' | head -1 | xargs dirname)
          echo "编译目录: $MAKEFILE_DIR"
          cd "$MAKEFILE_DIR"
          make clean
          make package FINALPACKAGE=1

      # 4. 上传 deb
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: NoNotesToolbar-deb
          path: "**/*.deb"